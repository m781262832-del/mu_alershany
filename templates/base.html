<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}موقعي{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
<nav class="navbar">
    <div class="container">
        <div class="logo">أبو الخطاب</div>
        <ul class="nav-links">
            <li>
                <a href="{{ url_for('home') }}" class="{% if active_page=='home' %}active{% endif %}">
                    الرئيسية
                </a>
            </li>
            <li>
                <a href="{{ url_for('about') }}" class="{% if active_page=='about' %}active{% endif %}">
                    من أنا
                </a>
            </li>
            <li>
                <a href="{{ url_for('projects') }}" class="{% if active_page=='projects' %}active{% endif %}">
                    المشاريع
                </a>
            </li>
            <li>
                <a href="{{ url_for('contact') }}" class="{% if active_page=='contact' %}active{% endif %}">
                    تواصل معي
                </a>
            </li>
        </ul>
    </div>
</nav>


<!-- Main Content -->
<main class="container">
    {% block content %}{% endblock %}
</main>

<!-- Footer -->
<footer class="footer">
    <div class="footer-text">
        © 2025 أبو الخطاب. جميع الحقوق محفوظة.
    </div>
</footer>


<script src="{{ url_for('static', filename='main.js') }}"></script>

</body>
</html>
